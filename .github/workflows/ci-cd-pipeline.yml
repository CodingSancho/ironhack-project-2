name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push vote
        uses: docker/build-push-action@v4
        with:
          context: ./vote
          push: true
          tags: vitotolantoto/vote:latest

      - name: Build and push result
        uses: docker/build-push-action@v4
        with:
          context: ./result
          push: true
          tags: vitotolantoto/result:latest

      - name: Build and push worker
        uses: docker/build-push-action@v4
        with:
          context: ./worker
          push: true
          tags: vitotolantoto/worker:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Install eksctl
        run: |
          curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin

      - name: Update kubeconfig
        run: eksctl utils write-kubeconfig --cluster romain-voting-app-cluster --region eu-west-3

      - name: Apply Kubernetes manifests
        run: kubectl apply -f K8s/